ref: infoblox.network_view_delete
label: "Delete Infoblox network view"
description: "Delete one non-default network view after exact-name confirmation; NIOS enforces object dependencies"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: infoblox_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: "infoblox.credentials", key_ref: true, description: "Pack-owned Infoblox credential Key ref"}
  name: {type: string, required: true}
  confirm_name: {type: string, required: true, description: "Must exactly equal name"}
  confirm: {type: boolean, const: true, required: true, description: "Must be true to authorize deletion"}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [infoblox, ipam, network-view, delete, destructive]
