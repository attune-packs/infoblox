ref: infoblox.network_list
label: "List Infoblox networks"
description: "List IPv4 or IPv6 networks in one network view with bounded paging"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: infoblox_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: "pack.infoblox.credentials", key_ref: true, description: "Pack-owned Infoblox credential Key ref"}
  family: {type: string, enum: [ipv4, ipv6], default: ipv4}
  network_view: {type: string, default: default}
  network: {type: string, description: "Optional exact CIDR"}
  return_fields: {type: array, items: {type: string}, max_items: 50}
  page_size: {type: integer, default: 200, minimum: 1, maximum: 1000}
  max_pages: {type: integer, default: 10, minimum: 1, maximum: 50}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [infoblox, ipam, network, list]
