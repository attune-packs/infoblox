ref: infoblox.zone_upsert
label: "Upsert Infoblox authoritative zone"
description: "Create an absent authoritative zone or update supplied comment/disable state"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: infoblox_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: "infoblox.credentials", key_ref: true, description: "Pack-owned Infoblox credential Key ref"}
  fqdn: {type: string, required: true, description: "Zone name, or network/CIDR for a reverse zone"}
  view: {type: string, default: default}
  zone_format: {type: string, enum: [FORWARD, IPV4, IPV6], description: "Create-only; required by NIOS for reverse zones"}
  ns_group: {type: string, description: "Create-only name server group"}
  comment: {type: string, max_length: 256}
  disable: {type: boolean}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [infoblox, dns, zone, upsert]
