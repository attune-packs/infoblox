ref: infoblox.next_available_ip
label: "Discover next Infoblox IP addresses"
description: "Discover but do not reserve candidate addresses; use fixed_address_allocate when a reservation is required"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: infoblox_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: "infoblox.credentials", key_ref: true, description: "Pack-owned Infoblox credential Key ref"}
  family: {type: string, enum: [ipv4, ipv6], default: ipv4}
  network: {type: string, required: true}
  network_view: {type: string, default: default}
  num: {type: integer, default: 1, minimum: 1, maximum: 100}
  exclude: {type: array, items: {type: string}, max_items: 100}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [infoblox, ipam, address, allocation, read-only]
