ref: infoblox.zone_delete
label: "Delete Infoblox authoritative zone"
description: "Delete one exact authoritative zone and its contained records after exact-name confirmation"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: infoblox_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: "infoblox.credentials", key_ref: true, description: "Pack-owned Infoblox credential Key ref"}
  fqdn: {type: string, required: true}
  view: {type: string, default: default}
  confirm_fqdn: {type: string, required: true, description: "Must exactly equal fqdn"}
  confirm: {type: boolean, const: true, required: true}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [infoblox, dns, zone, delete, destructive]
